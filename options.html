<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JP Subtitle Hover — settings</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1216;
        --panel: #171b21;
        --line: #2a313a;
        --text: #e8edf4;
        --muted: #98a3b2;
        --accent: #4c8dff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 20px 64px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      }
      main { max-width: 620px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.hint { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
      label { display: block; margin: 0 0 14px; font-size: 12px; color: var(--muted); }
      label span { display: block; margin-bottom: 5px; }
      input[type="text"], input[type="password"], input[type="number"] {
        width: 100%;
        padding: 9px 11px;
        background: #0d1014;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      input:focus { outline: 2px solid rgba(76, 141, 255, 0.45); outline-offset: 1px; }
      .row { display: flex; gap: 14px; }
      .row > label { flex: 1; }
      .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
      button {
        padding: 9px 16px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary { background: transparent; border-color: var(--line); color: var(--text); }
      button:hover { filter: brightness(1.08); }
      #status { color: var(--muted); font-size: 12px; }
      pre {
        margin: 16px 0 0;
        padding: 12px;
        background: #0d1014;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #c7d2e0;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 320px;
        overflow: auto;
      }
      pre:empty { display: none; }
      .small { margin: 22px 0 0; color: var(--muted); font-size: 12px; }
      a { color: #7fb0ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>JP Subtitle Hover</h1>
      <p class="hint">
        Hover Japanese subtitle text — including asbplayer's subtitles — to get the reading, English glosses
        and a translation of the whole line.
      </p>

      <section>
        <label>
          <span>API key</span>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…" />
        </label>

        <label>
          <span>Base URL (OpenAI-compatible)</span>
          <input id="baseUrl" type="text" spellcheck="false" />
        </label>

        <label>
          <span>Model</span>
          <input id="model" type="text" spellcheck="false" />
        </label>

        <div class="row">
          <label>
            <span>Hover delay (ms)</span>
            <input id="delay" type="number" min="0" max="600" step="10" />
          </label>
          <label class="check" style="align-self: end; margin-bottom: 14px">
            <input id="enabled" type="checkbox" />
            Enabled
          </label>
        </div>

        <div class="actions">
          <button id="save">Save</button>
          <button id="test" class="secondary">Test lookup</button>
          <span id="status"></span>
        </div>

        <pre id="out"></pre>
      </section>

      <p class="small">
        Free Groq keys: <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com/keys</a>.
        Lookups are cached per subtitle line, so re-watching costs nothing.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
